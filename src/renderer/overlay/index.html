<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.google.com https://*.googleapis.com;" />
  <title>FahOS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Small Floating Pop-up Widget with Butter-Smooth Rounded Edges -->
  <div id="widget" class="widget">
    
    <!-- Ambient Magic Twinkle Stars -->
    <span class="twinkle-star star-tl">✦</span>
    <span class="twinkle-star star-tr">✧</span>

    <!-- Top Header -->
    <div class="widget-header">
      <div class="brand">
        <div class="logo-box">
          <img src="assets/logo.png" alt="FahOS Logo" class="brand-logo" />
        </div>
        <div class="brand-title-wrap">
          <span class="brand-name">FahOS</span>
          <span class="brand-sparkle">✦</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Small Mic Button Outside -->
        <button id="micIconBtn" class="mic-icon-btn active" title="Toggle Microphone (Voice-to-Text)">
          <svg class="mic-svg" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>

        <!-- Listening Pill Indicator Outside -->
        <div id="micBtn" class="mic-toggle active" title="Voice Status">
          <span class="mic-wave">
            <i></i><i></i><i></i><i></i>
          </span>
          <span id="micStatus" class="mic-label">Listening</span>
        </div>

        <!-- Droplet Action Menu (Expandable Speed-Dial) -->
        <div id="dropletMenuWrapper" class="droplet-menu-wrapper">
          <!-- Main + Button (rotates to x when open) -->
          <button id="dropletTriggerBtn" class="droplet-trigger-btn" title="More Tools (+)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>

          <!-- Droplet Buttons Stack (Animated Popout) -->
          <div id="dropletStack" class="droplet-stack">
            <!-- Droplet 1: Screen Snipper -->
            <button id="snipBtn" class="droplet-item" data-tooltip="Snip Screen" title="Snip Screen Region & Analyze">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="6" cy="6" r="3"></circle>
                <circle cx="6" cy="18" r="3"></circle>
                <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
              </svg>
            </button>

            <!-- Droplet 2: Saved Directory -->
            <button id="phonebookBtn" class="droplet-item" data-tooltip="Directory" title="Saved Directory (Contacts & Emails)">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
            </button>

            <!-- Droplet 3: History -->
            <button id="historyBtn" class="droplet-item" data-tooltip="History" title="View Chat History">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- FahOS Browser Button (Login to Google, GitHub, etc.) -->
        <button id="openBrowserBtn" class="browser-icon-btn" title="Open FahOS Browser (Sign in to Google, GitHub, etc.)" aria-label="Open Browser">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </button>

        <!-- Reset Window Size Button -->
        <button id="resetSizeBtn" class="reset-size-btn" title="Reset Window Size (Default 265px)" aria-label="Reset Size">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 14 10 14 10 20"></polyline>
            <polyline points="20 10 14 10 14 4"></polyline>
            <line x1="14" y1="10" x2="21" y2="3"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
        </button>

        <button id="closeBtn" class="close-icon" title="Dismiss (Esc)" aria-label="Close">✕</button>
      </div>
    </div>

    <!-- Active Chat View (Default) -->
    <div id="chatView" class="chat-view">
      <!-- User Speech / Text Input Bubble -->
      <div class="speech-bubble" id="speechBubble">
        <div id="attachedImagePill" class="attached-image-pill hidden">
          <img id="attachedThumbImg" class="attached-thumb-img" src="" alt="Snip Thumbnail" />
          <span class="attached-label">Snipped Region</span>
          <button id="removeImageBtn" class="remove-image-btn" title="Remove Image">✕</button>
        </div>
        <textarea id="promptInput" class="prompt-input" rows="2"
          placeholder="Tell FahOS what you want to do..." spellcheck="false"></textarea>
        <button id="sendBtn" class="send-btn" title="Send (Enter)" aria-label="Send">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <!-- FahOS Reasoning & Action Execution Pill -->
      <div class="widget-footer">
        <div id="aiResponseText" class="ai-text hidden"></div>
        <div id="actionPill" class="action-pill">
          <span id="pillIcon" class="pill-icon">✦</span>
          <span id="pillText" class="pill-text">FahOS AI Operating Layer Ready</span>
          <span id="pillStatus" class="pill-badge">●</span>
        </div>
      </div>

      <!-- Visual Security Confirmation Modal -->
      <div id="securityModal" class="security-modal hidden">
        <div class="security-modal-content">
          <div class="security-title-wrap">
            <span class="security-icon">⚠️</span>
            <span class="security-title">SECURITY CONFIRMATION REQUIRED</span>
          </div>
          <div id="securityMessage" class="security-message">
            FahOS Security Guard requires interactive approval for this high-privilege desktop operation.
          </div>
          <div id="securityItemBox" class="security-item-box"></div>
          <div class="security-actions">
            <button id="securityCancelBtn" class="security-btn cancel-btn">Cancel Action</button>
            <button id="securityConfirmBtn" class="security-btn confirm-btn">Confirm & Execute</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Total History View (Slides in when History Button is clicked) -->
    <div id="historyView" class="history-view hidden">
      <div class="history-toolbar">
        <div class="history-title-group">
          <button id="historyBackBtn" class="history-back-btn" title="Back to Chat">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back to Chat</span>
          </button>
          <span class="history-heading">Total History</span>
          <span id="historyCountBadge" class="history-count">0</span>
        </div>

        <button id="clearHistoryBtn" class="clear-history-btn" title="Clear all saved history">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          <span>Clear History</span>
        </button>
      </div>

      <div id="historyList" class="history-list">
        <!-- History items rendered here -->
      </div>
    </div>

    <!-- FahOS Directory View (Slides in on "open FahOS phonebook", directory or save button) -->
    <div id="phonebookView" class="phonebook-view hidden">
      <div class="phonebook-toolbar">
        <div class="phonebook-title-group">
          <button id="phonebookBackBtn" class="history-back-btn" title="Back to Chat">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
          </button>
          <span class="history-heading">FahOS Directory</span>
          <span id="phonebookCountBadge" class="history-count">0</span>
        </div>
      </div>

      <!-- Quick Add Contact Bar: Name, Phone Number, and Email ID -->
      <div class="phonebook-add-bar">
        <input id="contactNameInput" type="text" placeholder="Name" class="phonebook-input name-input" />
        <input id="contactPhoneInput" type="text" placeholder="Phone (+91...)" class="phonebook-input phone-input" />
        <input id="contactEmailInput" type="email" placeholder="Email ID" class="phonebook-input email-input" />
        <button id="saveContactBtn" class="phonebook-add-btn" title="Save Contact">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>Save</span>
        </button>
      </div>

      <!-- Directory Contacts List -->
      <div id="phonebookList" class="phonebook-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Bottom Draggable Resize Handle (Vertical Drag Extension) -->
    <div id="bottomResizeHandle" class="bottom-resize-handle" title="Drag down to expand window vertically">
      <div class="resize-grip-bar"></div>
    </div>

  </div>

  <script src="../services/speechRecognition.js"></script>
  <script src="../shared/markdown.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
