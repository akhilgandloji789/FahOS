<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FahOS Screen Snipper</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* Canvas covering entire display */
    #backdropCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    /* Top Instructions Pill */
    .instruction-bar {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 30px;
      padding: 8px 18px;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.2s ease;
    }
    .instruction-icon {
      color: #10B981;
      font-size: 14px;
    }
    .instruction-sep {
      opacity: 0.3;
    }
    .instruction-kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #E4E4E7;
    }

    /* Floating Action Controls Bar on selection box */
    #actionToolbar {
      position: absolute;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(18, 18, 24, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 10px;
      padding: 6px 10px;
      z-index: 1001;
      cursor: default;
    }
    .toolbar-dimension {
      color: #A1A1AA;
      font-size: 11px;
      font-family: 'Consolas', monospace;
      padding-right: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    .toolbar-btn {
      border: none;
      outline: none;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .confirm-btn {
      background: #10B981;
      color: #FFFFFF;
    }
    .confirm-btn:hover {
      background: #059669;
      transform: scale(1.03);
    }
    .cancel-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #D4D4D8;
    }
    .cancel-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }
  </style>
</head>
<body>
  <canvas id="backdropCanvas"></canvas>

  <div id="instructionBar" class="instruction-bar">
    <span class="instruction-icon">✂</span>
    <span>Drag to select screen region</span>
    <span class="instruction-sep">|</span>
    <span><span class="instruction-kbd">Enter</span> Confirm</span>
    <span><span class="instruction-kbd">Esc</span> Cancel</span>
  </div>

  <div id="actionToolbar">
    <span id="dimensionLabel" class="toolbar-dimension">0 × 0</span>
    <button id="cancelBtn" class="toolbar-btn cancel-btn" title="Cancel (Esc)">✕ Cancel</button>
    <button id="confirmBtn" class="toolbar-btn confirm-btn" title="Confirm Selection (Enter)">✓ Confirm</button>
  </div>

  <script src="snip.js"></script>
</body>
</html>
